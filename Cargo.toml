[workspace]
resolver = "2"
members = [
    "crates/emergence-core",
    "crates/emergence-viewer",
    "crates/emergence-worlds",
    "crates/emergence-app",
]

[workspace.dependencies]
emergence-core = { path = "crates/emergence-core" }
emergence-viewer = { path = "crates/emergence-viewer" }
emergence-worlds = { path = "crates/emergence-worlds" }
noise = "0.9"
rayon = "1.10"
fastrand = "2.3"
wgpu = "24.0"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
winit = "0.30"
bytemuck = "1.21"
half = "2.4"
pollster = "0.4"
smallvec = "1"
bitcode = "0.6"
serde = { version = "1", features = ["derive"] }
rodio = { version = "0.19", default-features = false, features = ["symphonia-wav"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Optimize the simulation engine even in debug builds so `cargo run` is playable.
# The viewer/app crates stay at opt-level 0 for fast compile iteration.
[profile.dev.package.emergence-core]
opt-level = 2

[profile.dev.package.noise]
opt-level = 2

[profile.dev.package.rayon]
opt-level = 2
